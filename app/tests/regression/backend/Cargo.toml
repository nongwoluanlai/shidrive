[package]
name = "shidrive-audit-harness"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[dependencies]
# Official ACP SDK; keep stable protocol v1 and pin the audited API.
agent-client-protocol = { version = "=2.2.0", default-features = false }
tokio-util = { version = "0.7", features = ["codec"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "process", "io-util", "io-std", "macros", "sync", "time", "fs", "net"] }
uuid = { version = "=1.26.1", features = ["v4"] }
chrono = { version = "=0.4.45", features = ["serde"] }
rusqlite = { version = "=0.32.1", features = ["bundled"] }
log = "=0.4.34"
futures = "=0.3.34"
