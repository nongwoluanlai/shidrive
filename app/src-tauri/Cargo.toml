[package]
name = "shidrive"
version = "0.3.0"
edition = "2021"
description = "使驾 ShiDrive — AI 开发工作台"
default-run = "shidrive"

[features]
# tauri build 默认携带该 feature：release 下使用内嵌 frontendDist 资源而非 devUrl
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "macros", "sync", "time", "fs", "net"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
trash = "5"
open = "5"
socket2 = "0.5"
futures = "0.3"
sha2 = "0.10"
ureq = { version = "2", default-features = false, features = ["tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
log = "0.4"
env_logger = "0.11"

[profile.release]
strip = true
lto = true
